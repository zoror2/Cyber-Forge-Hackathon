# Local development only. Real vendor network access is not part of the test profile.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: configbridge
      POSTGRES_DB: configbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U configbridge -d configbridge']
      interval: 2s
      timeout: 3s
      retries: 15
  bootstrap:
    build:
      context: .
      args: {CMD: bootstrap}
    environment:
      MIGRATION_DATABASE_URL: postgres://configbridge:${POSTGRES_PASSWORD:?Generate .env first}@postgres:5432/configbridge?sslmode=disable
      DATABASE_URL: postgres://configbridge_app:${CB_APP_DB_PASSWORD:?Generate .env first}@postgres:5432/configbridge?sslmode=disable
      CB_ENV: dev
      CB_CREATE_RUNTIME_ROLE: '1'
      CB_BOOTSTRAP_TENANT: tenant-a
      CB_BOOTSTRAP_API_KEY: ${CB_BOOTSTRAP_API_KEY:?Generate .env first}
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  api:
    build:
      context: .
      args: {CMD: api}
    environment:
      DATABASE_URL: postgres://configbridge_app:${CB_APP_DB_PASSWORD:?Generate .env first}@postgres:5432/configbridge?sslmode=disable
      CB_ENV: dev
      CB_SECRETS_BACKEND: local
      CB_DEV_TENANT_KEYS: ${CB_DEV_TENANT_KEYS:?Generate .env first}
      CB_DEV_ALLOW_PRIVATE: 172.30.0.0/24
      CB_DEV_CA_FILE: /certs/cert.pem
      CB_LISTEN: 0.0.0.0:8080
      GOMEMLIMIT: 768MiB
      CB_JWT_SECRET: ${CB_JWT_SECRET:-}
      CB_DEV_MASTER_KEY: ${CB_DEV_MASTER_KEY:-}
      CB_SIGNUP: ${CB_SIGNUP:-}
      CB_OPERATOR_TOKEN: ${CB_OPERATOR_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CB_AI_PROVIDER: ${CB_AI_PROVIDER:-}
      CB_AI_MODEL: ${CB_AI_MODEL:-}
      CB_DOC_RENDERER: ${CB_DOC_RENDERER:-}
      CB_BEDROCK_REGION: ${CB_BEDROCK_REGION:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      CB_AI_ENABLED_TENANTS: ${CB_AI_ENABLED_TENANTS:-}
      CB_AI_DAILY_LIMIT: ${CB_AI_DAILY_LIMIT:-}
      CB_AI_DAILY_TOKEN_LIMIT: ${CB_AI_DAILY_TOKEN_LIMIT:-}
      CB_SIEM_ENABLED_TENANTS: ${CB_SIEM_ENABLED_TENANTS:-}
      CB_OPENSEARCH_URL: ${CB_OPENSEARCH_URL:-}
      CB_OPENSEARCH_USERNAME: ${CB_OPENSEARCH_USERNAME:-}
      CB_OPENSEARCH_PASSWORD: ${CB_OPENSEARCH_PASSWORD:-}
      CB_OPENSEARCH_CA_FILE: ${CB_OPENSEARCH_CA_FILE:-}
      CB_OPENSEARCH_NAMESPACE: ${CB_OPENSEARCH_NAMESPACE:-}
      CB_SMTP_ADDR: ${CB_SMTP_ADDR:-}
      CB_SMTP_FROM: ${CB_SMTP_FROM:-}
      CB_SMTP_USERNAME: ${CB_SMTP_USERNAME:-}
      CB_SMTP_PASSWORD: ${CB_SMTP_PASSWORD:-}
      CB_SMTP_TLS_MODE: ${CB_SMTP_TLS_MODE:-}
      CB_ALERT_EMAIL_ROUTES: ${CB_ALERT_EMAIL_ROUTES:-}
      CB_ALERT_USE_ACCOUNT_EMAIL: ${CB_ALERT_USE_ACCOUNT_EMAIL:-0}
    # local dev only: your AWS profile, read-only (in AWS use a task role instead)
    volumes: ['./data/devcert/cert.pem:/certs/cert.pem:ro', '${AWS_DIR:?set AWS_DIR in .env}:/aws:ro']
    ports: ['127.0.0.1:8080:8080']
    mem_limit: 1g
    networks: [default, render]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      mockvendor: {condition: service_started}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  # Headless Chrome for JavaScript-only docs pages (CB_DOC_RENDERER=http://renderer:9222).
  # Own network: it can reach the internet and the API, not postgres or other
  # services; the API also checks every request the browser makes.
  # Start with: docker compose --profile render up
  renderer:
    image: ${CB_RENDERER_IMAGE:-}
    networks: [render]
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    profiles: [render]
  # SIEM search index (opt-in: --profile siem). Shares the api's network
  # namespace, so the api reaches it on its own loopback (http is allowed only
  # to loopback in dev); nothing is published to the host.
  opensearch:
    image: ${CB_OPENSEARCH_IMAGE:-}
    network_mode: service:api
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    security_opt: ['no-new-privileges:true']
    profiles: [siem]
  mockvendor:
    build:
      context: .
      args: {CMD: mockvendor}
    environment:
      MOCK_ADDR: :8081
      MOCK_TLS_CERT: /certs/cert.pem
      MOCK_TLS_KEY: /certs/key.pem
    volumes: ['./data/devcert:/certs:ro']
    ports: ['127.0.0.1:8081:8081']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  deps:
    image: golang:1.27
    working_dir: /src
    volumes: ['.:/src:ro','gomod:/go/pkg/mod']
    command: go mod download
    profiles: [tools]
  testpostgres:
    image: postgres:16
    environment:
      POSTGRES_USER: configbridge
      POSTGRES_DB: configbridge_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U configbridge -d configbridge_test']
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [checks]
    profiles: [tools]
  test:
    image: golang:1.27
    working_dir: /src
    volumes: ['.:/src:ro','gomod:/go/pkg/mod','gocache:/root/.cache/go-build']
    environment:
      TEST_DATABASE_URL: postgres://configbridge:${POSTGRES_PASSWORD:?Generate .env first}@testpostgres:5432/configbridge_test?sslmode=disable
      GOPROXY: 'off'
    command: sh -c 'unformatted=$$(gofmt -l cmd internal pkg tests); test -z "$$unformatted" || { echo "$$unformatted"; exit 1; }; go vet ./... && go test -race -count=1 -timeout=120s ./...'
    depends_on:
      deps: {condition: service_completed_successfully}
      testpostgres: {condition: service_healthy}
    networks: [checks]
    profiles: [tools]
  # Runs ONE connector config through the real engine (cmd/fetch, dev only):
  #   docker compose --profile tools run --rm fetch -config /examples/mock_users.json
  # Same dev egress rules as the API (internal/app.Policy): TLS mock, dev CA,
  # private range limited to the compose network. Plain HTTP is refused.
  fetch:
    build:
      context: .
      args: {CMD: fetch}
    environment:
      CB_ENV: dev
      CB_DEV_ALLOW_PRIVATE: 172.30.0.0/24
      CB_DEV_CA_FILE: /certs/cert.pem
      # Fake token for the mock's /secure endpoint, bound to the mock host only.
      # Real secrets never go in this file.
      CB_SECRET_MOCK: mock-token
      CB_SECRET_MOCK_HOSTS: mockvendor:8081
    volumes: ['./examples:/examples:ro','./data/devcert/cert.pem:/certs/cert.pem:ro']
    depends_on: [mockvendor]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    profiles: [tools]
networks:
  default:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  checks:
    internal: true
  render:
volumes:
  pgdata:
  gomod:
  gocache:
