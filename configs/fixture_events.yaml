version: 1
id: fixture_events
name: Offline four-record demonstration
enabled: true
request:
  method: GET
  url: https://example.invalid/events.json
  params: {}
  headers:
    Accept: application/json
  timeout_seconds: 5
auth:
  type: none
response:
  items_path: vulnerabilities
pagination:
  type: none
schedule:
  enabled: false
  interval_seconds: 900
destination:
  entity: event
  mapping:
    id:
      path: cveID
      required: true
      transform: string
    type:
      constant: known_exploited_vulnerability
    severity:
      constant: unknown
    timestamp:
      path: dates.added
      required: true
      transform: datetime
      format: '%Y-%m-%d'
      timezone: UTC
      precision: date
    description:
      path: shortDescription
      required: true
      transform: string
limits:
  max_response_bytes: 1048576
retry:
  max_attempts: 1
  base_delay_seconds: 0
  max_backoff_seconds: 0

