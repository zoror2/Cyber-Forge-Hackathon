# Tunnel origin: cloudflared (same network namespace) -> https://localhost:8443 -> api.
# The Cloudflare dashboard only accepts https origins; the cert is self-signed
# (loopback hop, route uses "No TLS Verify"). Never reachable off the host.
server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost;
    ssl_certificate     /certs/origin.pem;
    ssl_certificate_key /certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
