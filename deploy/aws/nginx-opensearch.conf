# TLS + basic auth in front of OpenSearch (which listens on plain http, loopback
# only). The API connects to https://127.0.0.1:9443 with the private CA.
server {
    listen 127.0.0.1:9443 ssl;
    ssl_certificate     /certs/opensearch.pem;
    ssl_certificate_key /certs/opensearch-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    auth_basic "opensearch";
    auth_basic_user_file /certs/htpasswd;
    location / {
        proxy_pass http://127.0.0.1:9200;
        proxy_set_header Authorization "";
    }
}
