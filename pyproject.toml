[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "configbridge"
version = "0.1.0"
description = "A small configuration-driven JSON integration engine"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx==0.28.1", "pydantic==2.11.7", "PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
configbridge = "configbridge.cli:main"

[tool.setuptools.packages.find]
include = ["configbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

